services:
  api:
    environment:
      FRONTEND_URL: "http://${WEB_HOSTNAME}"
  web:
    ports: !reset []
    networks:
      - default
      - local-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=local-gateway"
      - "traefik.http.routers.${STACK_IDENTIFIER}.rule=Host(`${WEB_HOSTNAME}`)"
      - "traefik.http.routers.${STACK_IDENTIFIER}.entrypoints=web"
      - "traefik.http.routers.${STACK_IDENTIFIER}.service=${STACK_IDENTIFIER}"
      - "traefik.http.services.${STACK_IDENTIFIER}.loadbalancer.server.port=8080"

networks:
  local-gateway:
    external: true
    name: local-gateway
